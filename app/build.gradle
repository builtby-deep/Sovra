plugins {
    id 'com.android.application'
}

configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute(module('com.k2fsa.sherpa.onnx:sherpa-onnx'))
                .using(module('com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.8'))
    }
}

android {
    namespace 'com.builtbydeep.sovra'
    compileSdk 35

    defaultConfig {
        applicationId 'com.builtbydeep.sovra'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/*.so']
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.k2fsa.sherpa.onnx:sherpa-onnx:1.13.8'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    implementation platform('com.google.firebase:firebase-bom:34.1.0')
    implementation 'com.google.firebase:firebase-database'

    testImplementation 'junit:junit:4.13.2'
}
