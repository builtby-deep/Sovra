name: Build Sovra APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --max-workers=2
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sovra-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
